<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Vyxel Apps — every store, one place" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <clipPath id="clip"><rect width="1200" height="440" rx="28"></rect></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"></feGaussianBlur></filter>
  <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#5FF5D3"></stop><stop offset=".55" stop-color="#4390FF"></stop><stop offset="1" stop-color="#C5E6FB"></stop></linearGradient>
  <linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"></stop><stop offset="1" stop-color="#EC4899"></stop></linearGradient>
  <linearGradient id="i2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0284C7"></stop><stop offset="1" stop-color="#5FF5D3"></stop></linearGradient>
  <linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B91C1C"></stop><stop offset="1" stop-color="#F59E0B"></stop></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity=".10"></circle></pattern>
</defs>

<g clip-path="url(#clip)">
  <rect width="1200" height="440" fill="#0B1D4F"></rect>
  <g filter="url(#blur)" opacity="0.85">
    <circle class="b1" cx="180" cy="80" r="200" fill="#4390FF"></circle>
    <circle class="b2" cx="1000" cy="380" r="230" fill="#5FF5D3" opacity=".7"></circle>
    <circle class="b3" cx="700" cy="40" r="170" fill="#7C3AED" opacity=".7"></circle>
  </g>
  <rect width="1200" height="440" fill="url(#dots)"></rect>
  <text x="72" y="118" class="f" font-size="15" font-weight="700" letter-spacing="3.5" fill="#B9C6EA">OPEN-SOURCE ANDROID APP STORE</text>
  <text x="68" y="214" class="f" font-size="104" font-weight="800" letter-spacing="-4" fill="url(#title)">Vyxel Apps</text>
  <g class="f" font-size="30" font-weight="600" fill="#FFFFFF">
    <text x="72" y="276" class="l">Every store, one place<tspan class="cur" fill="#5FF5D3">▍</tspan></text>
    <text x="72" y="276" class="l l2">F-Droid, GitHub, Google Play, TapTap &amp; 14 more</text>
    <text x="72" y="276" class="l l3">Works offline · Zero ads · Zero bloat</text>
  </g>
  <g class="f" font-size="15" font-weight="700">
    <rect x="72" y="320" width="150" height="40" rx="20" fill="#5FF5D3"></rect><text x="147" y="345" text-anchor="middle" fill="#0B1D4F">v1.1.2 Bedrock</text>
    <rect x="234" y="320" width="112" height="40" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"></rect><text x="290" y="345" text-anchor="middle" fill="#FFFFFF">AGPL-3.0</text>
    <rect x="358" y="320" width="166" height="40" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"></rect><text x="441" y="345" text-anchor="middle" fill="#FFFFFF">Kotlin · Compose</text>
    <rect x="536" y="320" width="104" height="40" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"></rect><text x="588" y="345" text-anchor="middle" fill="#FFFFFF">API 26+</text>
  </g>
  
  <g class="fl" style="animation-delay:0s">
    <rect x="720" y="92" width="400" height="84" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"></rect>
    <rect x="738" y="106" width="56" height="56" rx="16" fill="url(#i1)"></rect>
    <rect x="810" y="116" width="120" height="12" rx="6" fill="#FFFFFF" opacity=".85"></rect>
    <rect x="810" y="138" width="170" height="10" rx="5" fill="rgba(255,255,255,0.14)"></rect>
    <rect x="1030" y="116" width="72" height="36" rx="18" fill="rgba(255,255,255,0.14)"></rect>
    
    <text x="1066" y="139" text-anchor="middle" class="f" font-size="14" font-weight="700" fill="#FFFFFF">Get</text>
  </g>
  
  <g class="fl" style="animation-delay:1.2s">
    <rect x="720" y="196" width="400" height="84" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"></rect>
    <rect x="738" y="210" width="56" height="56" rx="16" fill="url(#i2)"></rect>
    <rect x="810" y="220" width="150" height="12" rx="6" fill="#FFFFFF" opacity=".85"></rect>
    <rect x="810" y="242" width="130" height="10" rx="5" fill="rgba(255,255,255,0.14)"></rect>
    <rect x="1030" y="220" width="72" height="36" rx="18" fill="#4390FF"></rect>
    <rect x="1030" y="220" width="72" height="36" rx="18" fill="#5FF5D3" class="pg"></rect>
    <text x="1066" y="243" text-anchor="middle" class="f" font-size="14" font-weight="700" fill="#0B1D4F">Update</text>
  </g>
  
  <g class="fl" style="animation-delay:2.4s">
    <rect x="720" y="300" width="400" height="84" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"></rect>
    <rect x="738" y="314" width="56" height="56" rx="16" fill="url(#i3)"></rect>
    <rect x="810" y="324" width="100" height="12" rx="6" fill="#FFFFFF" opacity=".85"></rect>
    <rect x="810" y="346" width="190" height="10" rx="5" fill="rgba(255,255,255,0.14)"></rect>
    <rect x="1030" y="324" width="72" height="36" rx="18" fill="rgba(255,255,255,0.14)"></rect>
    
    <text x="1066" y="347" text-anchor="middle" class="f" font-size="14" font-weight="700" fill="#FFFFFF">Get</text>
  </g>
</g>
</svg>